<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- 'wasm-unsafe-eval' solo permite compilar WebAssembly; no habilita eval() de JavaScript -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self';">
    <title>Freedoom</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #111;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            color: #eee;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* El canvas tiene tamaño CSS fijo y se escala con transform (ver doom.js):
           si se estira con width/height al 100 %, el motor dibuja la imagen ampliada y corrida. */
        #canvas {
            display: block;
            width: 640px;
            height: 480px;
            flex-shrink: 0;
            transform-origin: center center;
            image-rendering: pixelated;
            outline: none;
            cursor: pointer;
        }
        #estado {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #111;
            font-size: 15px;
            text-align: center;
            padding: 20px;
        }
        #estado.oculto { display: none; }
        #estado strong { font-size: 20px; color: #ff6b4a; }
    </style>
</head>
<body>
    <canvas id="canvas" tabindex="0"></canvas>
    <div id="estado"><strong>Freedoom</strong><span id="textoEstado">Cargando motor…</span></div>
    <script type="module" src="doom.js"></script>
</body>
</html>
