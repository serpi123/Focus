<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" conten="width=device-width, initial-scale=1.0">

    <title> FOCUS - MODO ESTUDIO</title>

    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <!--tipografia -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap"
    rel="stylesheet">
</head>

<body>
    <main id="pantalla-estudio" class="pantalla-estudio">
        <h1 class="titulo">

            ESPACIO DE ESTUDIO DE JORGE
        </h1>
        <div class="marco-temporizador">
            <span id="temporizador">50:00</span>

        </div>
        <h2 class="subtitulo">
            TIME TO FOCUS
        </h2>
        <div class="marco-pokemon">
            <img src="assets/ghastly pokemon STICKER.gif"
            alt="Gengar, el pokemon de modo estudi"
            class="imagen-pokemon">
        </div>

        <button id="botonInicio" class="boton-inicio">
            Empezar
        </button>
    </main>
    <main id="pantalla-descanso" class="pantalla-estudio pantalla-descanso oculta">
        <h1 class="titulo">
            ESPACIO DE DESCANSO DE JORGE
        </h1>
        <div class="marco-temporizador">
            <span id="temporizador-descanso">10:00</span>

        </div>
        <h2 class="subtitulo">
            TIME TO CHILL
        </h2>
        <div class="marco-pokemon"> 
            <img src="assets/Pixel Eat Sticker.gif"
            alt="Snorlax, el pokemon de modo descanso"
            class="imagen-pokemon">
        </div>
        <button id="botonDescanso" class="boton-inicio">
            Empezar descanso
        </button>
    </main>
<script src="script.js"></script>

</body>
</html>


</html>
