<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com;">
    <title>Temporizador FOCUS</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: transparent; /* Deja pasar la transparencia de Electron */
            overflow: hidden;
            font-family: 'Fredoka', -apple-system, 'Segoe UI', sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 4px;
            -webkit-app-region: drag; /* Ventana arrastrable */
        }
        .tarjeta-reloj {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(76, 38, 170, 0.72);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1.5px solid rgba(255, 255, 255, 0.25);
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            transition: background 0.3s ease;
        }
        .tarjeta-reloj.descanso {
            background: rgba(27, 73, 101, 0.72);
        }
        .tarjeta-reloj.pausado .reloj-mini {
            opacity: 0.6;
        }
        .modo-mini {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1;
            margin-bottom: 2px;
        }
        .reloj-mini {
            font-size: 38px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 2px;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }
        /* Botón para volver a la ventana principal (aparece al pasar el ratón) */
        .btn-abrir {
            position: absolute;
            top: 6px;
            right: 8px;
            width: 22px;
            height: 22px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.18);
            color: #fff;
            font-size: 13px;
            line-height: 22px;
            padding: 0;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s ease, background 0.2s ease;
            -webkit-app-region: no-drag;
        }
        .tarjeta-reloj:hover .btn-abrir { opacity: 1; }
        .btn-abrir:hover { background: rgba(255, 255, 255, 0.35); }
    </style>
</head>
<body>
    <div class="tarjeta-reloj" id="tarjeta">
        <button class="btn-abrir" id="btnAbrir" type="button" title="Abrir FOCUS">↗</button>
        <div class="modo-mini" id="modoMini">Estudio</div>
        <div class="reloj-mini" id="displayMini">--:--</div>
    </div>

    <script src="temporizador.js"></script>
</body>
</html>
